version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxapay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fluxapay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluxapay"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluxapay-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/fluxapay?schema=public"
      JWT_SECRET: "fluxapay-production-docker-secret-key-32-chars"
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
